name: Build Personal Crystal

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-crystal-${{ github.ref }}
  cancel-in-progress: true

env:
  ROM_FILE: Pokemon-Personal-Crystal.gbc
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Game Boy Color ROM
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Get source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init -q .
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch -q --no-tags --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install RGBDS 1.0.x
        run: |
          set -euo pipefail

          sudo tee /etc/apt/preferences.d/rgbds >/dev/null <<'EOF'
          Package: rgbds
          Pin: version 1.0.*
          Pin-Priority: 1001

          Package: rgbds
          Pin: version *
          Pin-Priority: -1
          EOF

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            --no-install-recommends \
            rgbds \
            libpng-dev \
            pkg-config

          VERSION="$(rgbasm --version)"
          echo "RGBDS: ${VERSION}"

          if [[ ! "${VERSION}" =~ 1\.0\.[0-9]+ ]]; then
            echo "::error::RGBDS 1.0.x required. Found: ${VERSION}"
            exit 1
          fi

          RGBDS_VERSION="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            <<< "${VERSION}" | head -n1)"

          echo "RGBDS_VERSION=${RGBDS_VERSION}" >> "${GITHUB_ENV}"

      - name: Build tools
        run: |
          set -euo pipefail

          JOBS="$(nproc)"

          echo "Building tools using ${JOBS} threads"

          make -C tools -j"${JOBS}" --output-sync=target

      - name: Build Personal Crystal
        run: |
          set -euo pipefail

          JOBS="$(nproc)"

          make -j"${JOBS}" --output-sync=target

      - name: Verify ROM
        run: |
          set -euo pipefail

          if [[ ! -s "${ROM_FILE}" ]]; then
            echo "::error::ROM missing or empty: ${ROM_FILE}"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          rom_path = Path(os.environ["ROM_FILE"])
          rom = rom_path.read_bytes()

          if len(rom) < 0x150:
              sys.exit("ERROR: ROM is too small for a valid GB header")

          # Validate Game Boy header checksum.
          checksum = 0

          for byte in rom[0x134:0x14D]:
              checksum = (checksum - byte - 1) & 0xFF

          if checksum != rom[0x14D]:
              sys.exit(
                  f"ERROR: Invalid header checksum "
                  f"(expected {checksum:02X}, "
                  f"found {rom[0x14D]:02X})"
              )

          title = rom[0x134:0x144].split(b"\0")[0]

          print(f"ROM: {rom_path}")
          print(f"Size: {len(rom):,} bytes")
          print(f"Title: {title.decode('ascii', errors='replace')}")
          print("Header checksum: VALID")
          PY

          ls -lh "${ROM_FILE}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "${TAG}" "${ROM_FILE}" \
            --target "${GITHUB_SHA}" \
            --title "Personal Crystal Build ${GITHUB_RUN_NUMBER}" \
            --notes "Personal Crystal automated build.

          Commit: ${GITHUB_SHA}
          RGBDS: ${RGBDS_VERSION}
          Runner: Ubuntu 26.04
          Run: ${GITHUB_RUN_ID}
          Attempt: ${GITHUB_RUN_ATTEMPT}

          ROM validation: Passed."
          
