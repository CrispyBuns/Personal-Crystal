name: Build Personal Crystal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-crystal-manual
  cancel-in-progress: true

env:
  ROM_FILE: Pokemon-Personal-Crystal.gbc
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build Game Boy Color ROM
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Get source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init -q .
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch -q --no-tags --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: Install RGBDS v1.0.4
        run: |
          set -euo pipefail

          sudo tee /etc/apt/preferences.d/rgbds >/dev/null <<'EOF'
          Package: rgbds
          Pin: version 1.0.4*
          Pin-Priority: 1001

          Package: rgbds
          Pin: version *
          Pin-Priority: -1
          EOF

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            --no-install-recommends \
            rgbds libpng-dev pkg-config

          VERSION="$(rgbasm --version)"
          echo "RGBDS: ${VERSION}"

          if [[ ! "${VERSION}" =~ (^|[^0-9])v?1\.0\.4([^0-9]|$) ]]; then
            echo "::error::RGBDS v1.0.4 required. Found: ${VERSION}"
            exit 1
          fi

          echo "RGBDS_VERSION=1.0.4" >> "${GITHUB_ENV}"

      - name: Build tools
        run: |
          set -euo pipefail
          make -C tools -j"$(nproc)" --output-sync=target

      - name: Build Personal Crystal
        run: |
          set -euo pipefail
          make -j"$(nproc)" --output-sync=target

      - name: Verify ROM
        run: |
          set -euo pipefail

          if [[ ! -s "${ROM_FILE}" ]]; then
            echo "::error::ROM missing or empty: ${ROM_FILE}"
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          rom_path = Path(os.environ["ROM_FILE"])
          rom = rom_path.read_bytes()

          if len(rom) < 0x150:
              raise SystemExit("ERROR: ROM is too small")

          checksum = 0
          for byte in rom[0x134:0x14D]:
              checksum = (checksum - byte - 1) & 0xFF

          if checksum != rom[0x14D]:
              raise SystemExit("ERROR: Invalid ROM header checksum")

          title = rom[0x134:0x144].split(b"\0")[0]

          print(f"ROM: {rom_path}")
          print(f"Size: {len(rom):,} bytes")
          print(f"Title: {title.decode('ascii', errors='replace')}")
          print("Header checksum: VALID")
          PY

          ls -lh "${ROM_FILE}"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Crystal-ROM-RGBDS-1.0.4
          path: Pokemon-Personal-Crystal.gbc
          if-no-files-found: error
          retention-days: 30
          
