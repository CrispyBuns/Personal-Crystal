name: Build Personal Crystal

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  ROM_FILE: Pokemon-Personal-Crystal.gbc
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    # Ubuntu 26.04 is the first release whose repo has rgbds 1.0.x
    runs-on: ubuntu-26.04
    steps:
      # Plain git instead of actions/checkout (which is a Node.js action)
      - name: Get source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      # Always pull the newest Ubuntu packages.
      # The apt pin is written first so that neither the upgrade nor the
      # install below can ever move rgbds outside the 1.0.x series.
      - name: Update Ubuntu packages and install dependencies
        run: |
          sudo tee /etc/apt/preferences.d/rgbds >/dev/null <<'EOF'
          Package: rgbds
          Pin: version 1.0.*
          Pin-Priority: 1001

          Package: rgbds
          Pin: version *
          Pin-Priority: -1
          EOF

          sudo apt-get update
          sudo apt-get -y upgrade
          sudo apt-get install -y build-essential libpng-dev pkg-config python3

      # Runs every time: installs rgbds if missing, or upgrades it to the newest
      # 1.0.x if already installed, then verifies it really is 1.0.x.
      - name: Install RGBDS 1.0.x (Ubuntu package)
        run: |
          apt-cache policy rgbds
          if ! apt-cache policy rgbds | grep -Eq 'Candidate: (.*:)?1\.0\.'; then
            echo "::error::Ubuntu's repository has no rgbds 1.0.x for this release"
            exit 1
          fi

          sudo apt-get install -y rgbds

          pkg_ver=$(dpkg-query -W -f='${Version}' rgbds)
          pkg_ver="${pkg_ver#*:}"   # strip epoch, if any
          bin_ver=$(rgbasm --version)
          echo "Installed package: ${pkg_ver}"
          echo "Binary reports:    ${bin_ver}"

          if [[ "${pkg_ver}" != 1.0.* || ! "${bin_ver}" =~ 1\.0\.[0-9]+ ]]; then
            echo "::error::Expected rgbds 1.0.x but found ${pkg_ver} (${bin_ver})"
            exit 1
          fi

          # Make the exact version available to later steps (release notes)
          echo "RGBDS_VERSION=${pkg_ver%%-*}" >> "${GITHUB_ENV}"

      - name: Compile tools
        run: make -C tools -j"$(nproc)"

      - name: Build ROM
        run: make -j"$(nproc)"

      # gh CLI is preinstalled on GitHub-hosted Ubuntu runners
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -f "${ROM_FILE}"
          gh release create "build-${GITHUB_RUN_NUMBER}" "${ROM_FILE}" \
            --target "${GITHUB_SHA}" \
            --title "Personal Crystal build ${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA} with RGBDS ${RGBDS_VERSION}"
